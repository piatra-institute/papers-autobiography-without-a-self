- id: biehl-critique
  kind: source
  passage: The critiques of blanket-based individuation [@biehl2021] identify where to search, since they
    already exhibit systems in which the blanket partition is non-unique or misleading.
  evidence:
    citation_id: biehl2021
    locator: Abstract
    verified: true
    verification_note: DOI 10.3390/e23030293; the abstract shows that various definitions of the Markov
      blanket are not equivalent and gives counterexamples to the free energy lemma.
- id: schreiber-te
  kind: source
  passage: Directed information and transfer entropy [@massey1990; @schreiber2000] are the stochastic
    analogues of the same quantity, and they too are conditioned on a chosen partition of the variables
    into internal and external.
  evidence:
    citation_id: schreiber2000
    locator: Abstract
    verified: true
    verification_note: DOI 10.1103/PhysRevLett.85.461; the abstract derives transfer entropy by conditioning
      transition probabilities to distinguish driving from responding elements.
- id: crutchfield-causal
  kind: source
  passage: It is the deterministic predictive state of the system at the observable $x$, the state defined
    by which future observations the past permits, in the sense of the predictive-state representations
    of @littman2002 and the causal states of @crutchfield1989; its minimal predictive formulation is that
    of @{shalizi2001}.
  evidence:
    citation_id: crutchfield1989
    locator: Abstract
    verified: true
    verification_note: DOI 10.1103/PhysRevLett.63.105; the abstract reconstructs minimal equations of
      motion from measurement sequences, the construction whose states are the causal states.
- id: littman-psr
  kind: source
  passage: It is the deterministic predictive state of the system at the observable $x$, the state defined
    by which future observations the past permits, in the sense of the predictive-state representations
    of @littman2002 and the causal states of @crutchfield1989; its minimal predictive formulation is that
    of @{shalizi2001}.
  evidence:
    citation_id: littman2002
    locator: Abstract (NeurIPS proceedings page)
    verified: true
    verification_note: 'The NeurIPS 2001 proceedings page gives the abstract: states represented by multi-step
      action-conditional predictions of future observations.'
- id: driven-def
  kind: definition
  passage: 'A **driven system** is a triple $(Z, U, F)$ with $Z$ a finite set of states, $U$ a finite
    input alphabet, and $F : Z \times U \to Z$ a transition map.'
  rationale: Defines the systems the paper treats.
- id: fibre-def
  kind: definition
  passage: The autobiographical fibre is the quotient $A_x = F_x / {\sim_x}$.
  rationale: States the construction under examination.
- id: closure-def
  kind: definition
  passage: A partition $\rho$ is autobiographically closed when, for any two input words from a common
    start with identical $\rho$-output trajectories, the words leave the system in $\sim^{\rho}$-equivalent
    states.
  rationale: Defines self-predictable observables.
- id: prop-nerode
  kind: interpretation
  passage: The relation $\sim_x$ is Nerode equivalence restricted to $F_x$, and $A_x$ is canonically the
    fibre $Q_x$ of the minimal realization.
  rationale: Proposition proved in the text.
- id: prop-holonomy
  kind: interpretation
  passage: The group of units of $H_x$ is the Krohn-Rhodes holonomy group of the tile $Q_x$.
  rationale: Proposition proved in the text.
- id: prop-curvature
  kind: interpretation
  passage: No principal or linear connection has the self-history action as its holonomy, in general.
  rationale: Proposition proved in the text from invertibility of parallel transport and variable fibre
    size.
- id: prop-crypticity
  kind: interpretation
  passage: $\Delta_{\mathrm{ext}}(\pi) = 0$ if and only if the minimal $\pi$-transducer is observable
    from its output under unknown inputs, equivalently has zero structural crypticity, equivalently synchronizes
    to its output.
  rationale: Proposition proved in the text.
- id: prop-refinement
  kind: interpretation
  passage: If $\rho, \sigma \in \mathrm{Cl}(Z)$ then $\rho \wedge \sigma \in \mathrm{Cl}(Z)$.
  rationale: Proposition proved in the text and checked by the sweep (zero violations, /common_refinement_violations_total).
- id: counterexample
  kind: interpretation
  passage: Their coarser union has blocks $\{0\}, \{1, 2, 3\}$ and is not closed.
  rationale: The four-state counterexample recorded in /min_coarser_union_counterexample with its witness;
    checkable by hand from the transition table.
- id: no-canonical-self
  kind: interpretation
  passage: A canonical self, defined from the dynamics alone as the coarsest nontrivial observable that
    predicts itself, does not exist in general.
  rationale: 'Consequence of the coarsening failure: the maximal closed coarse-grainings form an antichain.'
- id: informational-closure
  kind: interpretation
  passage: Informational closure, the property that a coarse-graining's future is conditionally independent
    of the fine detail given its own past, generates the same Moore-family structure and the same closure
    operator [@bertschinger2008; @pfante2014].
  rationale: Structural correspondence argued in the text; the Limitations section states that no explicit
    isomorphism is given.
- id: three-states
  kind: interpretation
  passage: Three states are too few for the failure to appear, since the only partitions between the discrete
    and the one-block partition are single merges, and the coarser union of two distinct single merges
    is the one-block partition, which is closed.
  rationale: Combinatorial argument in the text, consistent with zero failures in the exhaustive 3-state
    sweeps.
- id: deterministic-scope
  kind: assumption
  passage: The analysis is deterministic and finite.
  rationale: Scope assumption; the stochastic reduction is stated but not proved.
- id: open-problem
  kind: interpretation
  passage: If a finite system exists in which a discovered self and a Markov blanket disagree about which
    states are internal memory, and in which the self-history monoid on the discovered self's fibres separates
    systems that the blanket cannot, that disagreement would be the first content specific to the construction.
  rationale: States the open problem and what would count as new content.
