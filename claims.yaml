- id: friston-blanket
  kind: source
  passage: 'A discovered self, however it is selected from the antichain of maximal self-predictable coarse-grainings,
    can be compared with the partitions that other theories draw for the same purpose: the internal states
    of a Markov blanket [@friston2013; @kirchhoff2018], the components that an individuality measure assigns
    to a system as opposed to its environment [@krakauer2020], and the informationally closed coarse-graining.'
  evidence:
    citation_id: friston2013
    locator: Abstract
    verified: true
    verification_note: DOI 10.1098/rsif.2013.0475; the abstract describes a Markov blanket separating
      internal and external states.
- id: kirchhoff-blanket
  kind: source
  passage: 'A discovered self, however it is selected from the antichain of maximal self-predictable coarse-grainings,
