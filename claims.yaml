  passage: Self-predictable observables are closed under common refinement (proved, and confirmed without
    exception across 150,964 finite systems) but not under coarsening, which fails in 54,300 of the 65,536
    systems with four states and two inputs ($82.9\%$) and in $99.8\%$ of sampled six-state systems; a
    minimal four-state counterexample is given.
  evidence:
    file: simulation/output/results.json
    run_id: closure
    pointer: /systems_total
    reported: 150,964
    units: systems
    conditions: exhaustive sweep for |Z| <= 4 (|U| = 2, and |U| = 3 at |Z| = 3); fixed-seed samples (seed
      20260711) otherwise
    decimals: 0
