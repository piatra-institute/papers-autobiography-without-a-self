- id: fernando
  kind: source
  passage: '@fernando2009 built explicit molecular circuits that learn associatively; @biswas2021 find
    associative memory across published transcriptional-network models; the bistable multisite-phosphorylation
    cascade of @markevich2004 supplies the hysteresis that stores the acquired state.'
  evidence:
    citation_id: fernando2009
    locator: Abstract
    verified: true
    verification_note: DOI 10.1098/rsif.2008.0344; the abstract proposes a gene regulatory network capable
      of Hebbian associative learning in a single cell, developed as a mathematical model whose simulations
      show a learned response.
